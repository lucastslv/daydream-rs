[package]
name = "daydream-rs"
version = "0.1.0"
edition = "2024"
authors = ["Lucas Telles da Silva <lucas.telles@inf.ufrgs.br>"]
description = "A minimalist bilingual static site generator (SSG) in Rust"
license = "MIT"
repository = "https://github.com/lucastslv/daydream-rs"
readme = "README.md"
keywords = ["ssg", "blog", "markdown", "static-site", "bilingual"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "daydream"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
minijinja = "2.5"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

