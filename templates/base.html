<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{{ root_prefix | safe }}style.css">
  <link rel="alternate" hreflang="en" href="{{ hreflang_en | safe }}">
  <link rel="alternate" hreflang="pt-BR" href="{{ hreflang_pt | safe }}">
  <link rel="alternate" hreflang="x-default" href="{{ hreflang_en | safe }}">
</head>
<body>
  <div id="container">
    <main id="wrapper">
      <header id="banner">
        {% if is_pt %}
        <a class="language-switch" href="{{ language_switch_href | safe }}" aria-label="View site in English" title="English">
          <img src="{{ root_prefix | safe }}img/en.png" alt="English">
        </a>
        <h1>{{ site_title }}</h1>
        <p>{{ subtitle_pt }}</p>
        {% else %}
        <a class="language-switch" href="{{ language_switch_href | safe }}" aria-label="Switch to Portuguese" title="Português">
          <img src="{{ root_prefix | safe }}img/br.png" alt="Português">
        </a>
        <h1>{{ site_title }}</h1>
        <p>{{ subtitle_en }}</p>
        {% endif %}
      </header>

      <nav id="nav" aria-label="{% if is_pt %}Navegação principal{% else %}Main navigation{% endif %}">
        <ul>
          <li><a href="{{ lang_prefix | safe }}index.html">Home</a></li>
          <li><a href="{{ lang_prefix | safe }}projects.html">{% if is_pt %}Projetos{% else %}Projects{% endif %}</a></li>
          <li><a class="current" href="{{ lang_prefix | safe }}blog.html">Blog</a></li>
        </ul>
      </nav>

      <section id="page">
        {% block content %}{% endblock %}
      </section>
    </main>

    <footer id="footer">
      <p>{{ footer_text }}</p>
    </footer>
  </div>
</body>
</html>
